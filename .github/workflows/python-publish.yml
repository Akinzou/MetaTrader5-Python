name: Publish to PyPI

on:
  workflow_dispatch: 

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pythonmetatrader5/

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Nothing after checkout needs git auth; build tools run with no token.
          persist-credentials: false

      # A tag can sit on any commit; release only what was merged to master.
      - name: Require the tagged commit to be on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_REF is not on master; merge the release PR first"
            exit 1
          }

      # Being on master is not being green: an --admin merge skips the PR checks.
      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          [ "$runs" -gt 0 ] || {
            echo "::error::ci.yml has no successful run for $GITHUB_SHA"
            exit 1
          }

      # The PyPI page links the docs site, so the site shows this release
      # before the package goes out (ADR 0013). The deploy job itself must have
      # succeeded: a run whose deploy was skipped (a pull request, a manual run
      # from the tag) still ends green and proves nothing.
      - name: Require the docs site deployed from the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docs.yml/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs[].id'); do
            deployed+=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs"               --jq '.jobs[] | select(.name == "publish to GitHub Pages" and .conclusion == "success") | .id')
          done
          [ -n "$deployed" ] || {
            echo "::error::no docs.yml deploy succeeded for $GITHUB_SHA; wait for the master run or re-run it from master"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Clean previous builds
        run: rm -rf dist build *.egg-info

      # PyPI cannot render Mermaid: each diagram becomes a link to its section
      # of the README on GitHub (ADR 0014). Before the pinning below, which
      # pins those links to the tag too.
      - name: Replace README diagrams with links
        run: python scripts/replace_readme_diagrams.py

      # Fails unless run from the tag v<version> (gh workflow run ... --ref vX.Y.Z),
      # so the package and its README links come from the same release (ADR 0012).
      - name: Pin README links to the release tag
        run: python scripts/pin_readme_links.py "$GITHUB_REF"

      - name: Build package
        run: python -m build

      - name: Twine check
        run: twine check --strict dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
